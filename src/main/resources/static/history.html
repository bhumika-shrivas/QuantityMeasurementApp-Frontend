<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement App | History</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="history">
    <header id="navbarMount"></header>

    <main class="page-wrap">
      <section class="section-title reveal d1">
        <div>
          <h1>Operation History</h1>
          <p id="historySubtitle">0 total operations</p>
        </div>
      </section>

      <section class="card reveal d2" style="padding:1rem;">
        <div class="chips" style="margin-bottom:0.85rem;">
          <button type="button" class="chip active" data-filter="ALL">ALL</button>
          <button type="button" class="chip" data-filter="COMPARE">COMPARE</button>
          <button type="button" class="chip" data-filter="ADD">ADD</button>
          <button type="button" class="chip" data-filter="SUBTRACT">SUBTRACT</button>
          <button type="button" class="chip" data-filter="DIVIDE">DIVIDE</button>
          <button type="button" class="chip" data-filter="CONVERT">CONVERT</button>
          <button type="button" class="chip" data-filter="ERRORS">ERRORS</button>
        </div>

        <div class="field" style="margin-bottom:0.85rem;">
          <label for="historySearch">Search by unit, type, operation</label>
          <input id="historySearch" type="text" placeholder="Try KILOGRAM, LengthUnit, ADD..." />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Operation</th>
                <th>Input Values</th>
                <th>Result</th>
                <th>Status</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="historyRows">
              <tr>
                <td colspan="5" class="center muted">Loading history...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <p id="historyFooter" class="muted" style="margin-top:0.85rem;">Showing 0 of 0 operations</p>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
