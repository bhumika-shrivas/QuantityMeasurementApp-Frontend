<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement App | Operations</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="operations">
    <header id="navbarMount"></header>

    <main class="page-wrap">
      <section class="section-title reveal d1">
        <div>
          <h1>Operations Lab</h1>
          <p>Switch operation mode and calculate in one place.</p>
        </div>
      </section>

      <section class="card reveal d2" style="padding:1rem;">
        <div class="tabs" style="margin-bottom:1rem;">
          <button class="btn btn-ghost tab-btn active" data-op="compare" type="button">Compare</button>
          <button class="btn btn-ghost tab-btn" data-op="add" type="button">Add</button>
          <button class="btn btn-ghost tab-btn" data-op="subtract" type="button">Subtract</button>
          <button class="btn btn-ghost tab-btn" data-op="divide" type="button">Divide</button>
          <button class="btn btn-ghost tab-btn" data-op="convert" type="button">Convert</button>
        </div>

        <form id="opForm" class="reveal d3">
          <div class="split-grid">
            <div class="card" style="padding:0.85rem;">
              <h3 id="leftTitle">First Quantity</h3>
              <div class="field" style="margin-top:0.8rem;">
                <label for="firstValue">Value</label>
                <input id="firstValue" type="number" step="any" required />
              </div>
              <div class="field" style="margin-top:0.7rem;">
                <label for="firstType">Measurement Type</label>
                <select id="firstType"></select>
              </div>
              <div class="field" style="margin-top:0.7rem;">
                <label for="firstUnit">Unit</label>
                <select id="firstUnit"></select>
              </div>
            </div>

            <div class="card" style="padding:0.85rem;">
              <h3 id="rightTitle">Second Quantity</h3>
              <div id="secondValueWrap" class="field" style="margin-top:0.8rem;">
                <label for="secondValue">Value</label>
                <input id="secondValue" type="number" step="any" required />
              </div>
              <div class="field" style="margin-top:0.7rem;">
                <label for="secondType">Measurement Type</label>
                <select id="secondType"></select>
              </div>
              <div class="field" style="margin-top:0.7rem;">
                <label for="secondUnit">Unit</label>
                <select id="secondUnit"></select>
              </div>
            </div>
          </div>

          <div class="center" style="margin-top:1rem;">
            <button id="calculateBtn" class="btn btn-primary" type="submit">Calculate</button>
          </div>
        </form>

        <div id="resultBox" class="result-box">
          <div id="resultValue" class="result-value">--</div>
          <div id="resultMeta" class="mono muted" style="margin-top:0.35rem;"></div>
          <button id="copyResultBtn" class="btn btn-ghost" type="button" style="margin-top:0.85rem;">Copy Result</button>
        </div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
